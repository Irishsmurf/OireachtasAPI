site_name: Oireachtas API Python SDK
site_url: https://irishsmurf.github.io/OireachtasAPI/
site_description: A modern, lightweight Python client SDK for querying open parliament data from the national parliament of Ireland (Houses of the Oireachtas).
site_author: Irishsmurf

repo_name: Irishsmurf/OireachtasAPI
repo_url: https://github.com/Irishsmurf/OireachtasAPI

theme:
  name: material
  palette:
    # Palette toggle for light/dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - API Reference:
    - Constituencies API: ConstituenciesApi.md
    - Debates API: DebatesApi.md
    - Divisions API: DivisionsApi.md
    - Filters API: FiltersApi.md
    - Houses API: HousesApi.md
    - Legislation API: LegislationApi.md
    - Members API: MembersApi.md
    - Parties API: PartiesApi.md
    - Questions API: QuestionsApi.md
  - Data Models:
